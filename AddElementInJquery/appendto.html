<!DOCTYPE html>
<html>
<head>
    <title>AppendTo Example</title>
       <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>
<body>

    <div id="box">
        <h2>Hello World</h2>
    </div>

    <script>
        $(document).ready(function(){

            $("<p>Welcome to jQuery</p>").appendTo("#box");

        });
    </script>

</body>
</html>
