<!DOCTYPE html>
<html>
<head>
    <title>jQuery After</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div id="box">
        <h2>Hello World</h2>
    </div>

    <script>
        $(document).ready(function(){
            $("#box").after("<p>This is after element</p>");
        });
    </script>

</body>
</html>
